[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.1.0.dev0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "cpmpy",
]

[project.optional-dependencies]
dataflow = [
    "loom-dataflow==1.0.6",
]
helion = [
    "helion-mlir",
]

[dependency-groups]
dev = [
    "lit",
    "pytest",
    "ruff",
]

[tool.uv]
required-version = ">=0.11.0"

[tool.uv.sources]
helion-mlir = { workspace = true }
loom-dataflow = { workspace = true }

[tool.uv.workspace]
members = [
    "third_party/helion-mlir",
    "third_party/loom-dataflow",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["loom*"]
